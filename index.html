<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050b">
  <meta name="robots" content="noindex, nofollow">
  <title>Für Papa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f5c56b' d='M12 21 3.6 12.9a5.1 5.1 0 0 1 7.3-7.2l1.1 1.1 1.1-1.1a5.1 5.1 0 0 1 7.3 7.2z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ebenen von hinten nach vorne -->
  <canvas id="sterne" aria-hidden="true"></canvas>
  <div id="fotos" aria-hidden="true"></div>
  <canvas id="funken" aria-hidden="true"></canvas>
  <canvas id="glanz" aria-hidden="true"></canvas>
  <div id="texte" aria-live="polite"></div>
  <div id="blitz" aria-hidden="true"></div>

  <!-- Sperre: wenn Papa zu früh scannt -->
  <section id="sperre" class="screen" hidden>
    <p class="kicker" style="--i:0">Tag 8</p>
    <h1 class="sperre-titel" style="--i:1" data-text="sperre.titel"></h1>
    <p class="sperre-text" style="--i:2" data-text="sperre.text"></p>
    <div class="countdown" style="--i:3">
      <div class="feld"><b id="cd-tage">00</b><span>Tage</span></div>
      <div class="feld"><b id="cd-std">00</b><span>Std</span></div>
      <div class="feld"><b id="cd-min">00</b><span>Min</span></div>
      <div class="feld"><b id="cd-sek">00</b><span>Sek</span></div>
    </div>
    <p class="hinweis" style="--i:4" data-text="sperre.klein"></p>
  </section>

  <!-- Start: ein Tipp ist nötig, damit das Handy Musik abspielen darf -->
  <section id="start" class="screen" hidden>
    <p class="kicker" style="--i:0" data-text="start.oben"></p>
    <h1 class="titel" style="--i:1">
      <span class="titel-klein" data-text="start.titelKlein"></span>
      <span class="titel-gross"><span data-text="start.titelGross"></span></span>
    </h1>
    <div class="herzchen" style="--i:2" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21 3.6 12.9a5.1 5.1 0 0 1 7.3-7.2l1.1 1.1 1.1-1.1a5.1 5.1 0 0 1 7.3 7.2z"/></svg>
    </div>
    <button id="los" class="knopf" style="--i:3" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      <span data-text="start.knopf"></span>
    </button>
    <p class="hinweis" style="--i:4" data-text="start.hinweis"></p>
  </section>

  <button id="ton" class="ton" type="button" aria-label="Ton aus" hidden>
    <svg class="an" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="aus" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
  </button>

  <button id="nochmal" class="knopf leise" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg>
    <span data-text="finale.nochmal"></span>
  </button>

  <audio id="musik" preload="auto" playsinline></audio>

  <script src="inhalt.js"></script>
  <script src="app.js"></script>
</body>
</html>
